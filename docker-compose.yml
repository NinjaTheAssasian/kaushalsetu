services:
  db:
    image: postgres:16-alpine
    container_name: kaushalsetu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kaushalsetu
      POSTGRES_USER: kaushalsetu
      POSTGRES_PASSWORD: kaushalsetu_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaushalsetu -d kaushalsetu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
